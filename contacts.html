<style>
    /* ===== STABILITÉ LAYOUT ===== */
    html {
        overflow-y: scroll; /* Force la barre de défilement pour éviter le décalage */
    }
    
    /* ===== ANIMATION ARRIÈRE-PLAN ===== */
    #cyber-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        opacity: 0.15; /* Subtil et professionnel */
    }

    /* ===== PROFESSIONAL DESIGN SYSTEM ===== */
    :root {
        --primary: #6366f1;
        --secondary: #06b6d4;
        --darker: #0d279a;
        --light: #f8fafc;
    }

    /* ===== THEME CONTACT ===== */
    .form-heading {
        color: var(--light);
    }

    .input-field:focus {
        outline: 1px solid var(--primary) !important;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1) !important;
    }

    .sendMessage-btn {
        background: var(--primary) !important;
        color: var(--darker) !important;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .sendMessage-btn:hover {
        background: var(--secondary) !important;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
    }

    .success-message {
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .error-message {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }
</style>

    <div class="contact-section">
        <div class="form-card1">
            <div class="form-card2">
                <form class="form" action="https://formspree.io/f/mnqewbed" method="POST">
                    <p class="form-heading" data-lang-key="contact_heading">Contactez-moi</p>

                    <div class="form-field">
                        <input required placeholder="Nom" class="input-field" type="text" name="name" data-lang-key="contact_name" />
                    </div>

                    <div class="form-field">
                        <input required placeholder="Email" class="input-field" type="email" name="email" data-lang-key="contact_email" />
                    </div>

                    <div class="form-field">
                        <input required placeholder="Sujet" class="input-field" type="text" name="subject" data-lang-key="contact_subject" />
                    </div>

                    <div class="form-field">
                        <textarea required placeholder="Message" cols="30" rows="4" class="input-field" name="message" data-lang-key="contact_message"></textarea>
                    </div>

                    <button class="sendMessage-btn" type="submit" id="submitBtn" data-lang-key="contact_btn">Envoyer</button>
                    <div class="form-message success-message" id="successMessage" data-lang-key="contact_success">✓ Message envoyé avec succès!</div>
                    <div class="form-message error-message" id="errorMessage" data-lang-key="contact_error">✗ Erreur lors de l'envoi du message</div>
                </form>
            </div>
        </div>
    </div>
